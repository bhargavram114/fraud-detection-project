[project]
name = "atm-fraud-detection"
version = "1.0.0"
description = "Real-time ATM fraud detection pipeline — PySpark Structured Streaming"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pyspark==3.5.0",
    "kafka-python==2.0.2",
    "faker==24.0.0",
    "pyyaml==6.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobs*", "producer*"]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "ruff==0.4.1",
]

[tool.uv]
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.ruff]
line-length   = 100
target-version = "py311"
select = ["E","F","W","I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["jobs"]
omit   = ["jobs/__init__.py","jobs/rules/__init__.py"]

[tool.coverage.report]
fail_under   = 80
show_missing = true
