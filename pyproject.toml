[project]
name = "atm-fraud-detection"
version = "1.0.0"
description = "Real-time ATM fraud detection pipeline using PySpark Structured Streaming"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Core streaming
    "pyspark==3.5.0",
    "kafka-python==2.0.2",
    # Test data generation
    "faker==24.0.0",
    # Config
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "ruff==0.4.1",
]

[tool.uv]
# uv uses this to pin the exact Python version for the venv
python = "3.11"

[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# PySpark logs are noisy — suppress below ERROR in tests
log_cli = false
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]   # pycodestyle + pyflakes + isort
ignore = ["E501"]               # long lines OK in Spark chains

[tool.ruff.per-file-ignores]
"tests/*" = ["F401"]            # unused imports OK in test files

[tool.coverage.run]
source = ["jobs"]
omit   = ["jobs/__init__.py", "jobs/rules/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
