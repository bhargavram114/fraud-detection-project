name: Fraud Detection CI/CD
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: fraud-detection
  REGISTRY: your-registry.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { java-version: "11", distribution: "temurin" }
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest tests/ -v --cov=jobs --cov-report=xml --cov-fail-under=80

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} .
      - name: Push image
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login $REGISTRY -u ${{ secrets.REGISTRY_USER }} --password-stdin
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v3
        with: { kubeconfig: "${{ secrets.KUBE_CONFIG_PROD }}" }
      - run: |
          kubectl set image deployment/fraud-detection-driver \
            spark-driver=$REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            -n fraud-detection
          kubectl rollout status deployment/fraud-detection-driver -n fraud-detection --timeout=300s
