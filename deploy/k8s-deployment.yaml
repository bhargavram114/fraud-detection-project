# Kubernetes deployment for the fraud detection Spark job
---
apiVersion: v1
kind: Namespace
metadata:
  name: fraud-detection
---
# ── Secrets are NOT stored in this file ──────────────────────────────────────
# The previous version committed a Secret with plain-text stringData. Kubernetes
# Secrets are only base64-encoded, so committing one to git leaks it to anyone
# with repo access. Also, the three values that used to be here (broker address,
# checkpoint path, output path) are configuration, not secrets — they now live in
# the ConfigMap below.
#
# Real secrets (Kafka SASL credentials, object-store keys) are created out of
# band and referenced by name. Pick one:
#   kubectl -n fraud-detection create secret generic fraud-detection-secrets \
#     --from-literal=KAFKA_SASL_CONFIG='...' \
#     --from-literal=AWS_ACCESS_KEY_ID='...' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='...'
#   ...or sync it from a secrets manager (External Secrets Operator, Sealed
#   Secrets, Vault, AWS Secrets Manager) so no secret value is ever in git.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-config
  namespace: fraud-detection
data:
  APP_ENV: "prod"
  LOG_LEVEL: "WARN"
  KAFKA_BROKER: "kafka-internal.prod.svc.cluster.local:9092"
  CHECKPOINT_DIR: "s3a://prod-data-lake/checkpoints/fraud-detection"
  PARQUET_OUTPUT: "s3a://prod-data-lake/fraud-alerts"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-driver
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection
  template:
    metadata:
      labels:
        app: fraud-detection
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: spark-driver-sa
      containers:
        - name: spark-driver
          image: your-registry/fraud-detection:1.0.0
          command:
            - spark-submit
            - --master
            - k8s://https://kubernetes.default.svc:443
            - --deploy-mode
            - client
            - --packages
            - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
            - --conf
            - spark.executor.instances=3
            - --conf
            - spark.executor.memory=4g
            - --conf
            - spark.sql.shuffle.partitions=50
            - /app/jobs/fraud_detection_prod.py
          envFrom:
            - configMapRef:
                name: fraud-detection-config
            - secretRef:
                name: fraud-detection-secrets   # created out of band (see top of file)
                optional: true                  # clusters without SASL/S3 keys need none
          resources:
            requests: { memory: "2Gi", cpu: "1" }
            limits:   { memory: "4Gi", cpu: "2" }
          livenessProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-driver-sa
  namespace: fraud-detection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver-role
  namespace: fraud-detection
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver-rolebinding
  namespace: fraud-detection
subjects:
  - kind: ServiceAccount
    name: spark-driver-sa
roleRef:
  kind: Role
  name: spark-driver-role
  apiGroup: rbac.authorization.k8s.io
