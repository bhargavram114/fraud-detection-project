# Kubernetes deployment for the fraud detection Spark job
---
apiVersion: v1
kind: Namespace
metadata:
  name: fraud-detection
---
apiVersion: v1
kind: Secret
metadata:
  name: fraud-detection-secrets
  namespace: fraud-detection
type: Opaque
stringData:
  KAFKA_BROKER: "kafka-internal.prod.svc.cluster.local:9092"
  CHECKPOINT_DIR: "s3a://prod-data-lake/checkpoints/fraud-detection"
  PARQUET_OUTPUT: "s3a://prod-data-lake/fraud-alerts"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-config
  namespace: fraud-detection
data:
  APP_ENV: "prod"
  LOG_LEVEL: "WARN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-driver
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection
  template:
    metadata:
      labels:
        app: fraud-detection
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: spark-driver-sa
      containers:
        - name: spark-driver
          image: your-registry/fraud-detection:1.0.0
          command:
            - spark-submit
            - --master
            - k8s://https://kubernetes.default.svc:443
            - --deploy-mode
            - client
            - --packages
            - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
            - --conf
            - spark.executor.instances=3
            - --conf
            - spark.executor.memory=4g
            - --conf
            - spark.sql.shuffle.partitions=50
            - /app/jobs/fraud_detection_prod.py
          envFrom:
            - secretRef:
                name: fraud-detection-secrets
            - configMapRef:
                name: fraud-detection-config
          resources:
            requests: { memory: "2Gi", cpu: "1" }
            limits:   { memory: "4Gi", cpu: "2" }
          livenessProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-driver-sa
  namespace: fraud-detection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver-role
  namespace: fraud-detection
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver-rolebinding
  namespace: fraud-detection
subjects:
  - kind: ServiceAccount
    name: spark-driver-sa
roleRef:
  kind: Role
  name: spark-driver-role
  apiGroup: rbac.authorization.k8s.io
